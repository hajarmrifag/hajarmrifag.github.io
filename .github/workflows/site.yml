name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Site and interactive models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check pages, local links, assets and JavaScript
        run: npm run check
      - name: Verify interaction model invariants
        run: npm test
      - name: Check whitespace
        run: git diff --check
